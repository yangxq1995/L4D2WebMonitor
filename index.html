<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="51青年">
    <title>求生之路2 - 服务器监控</title>
    <style>
        :root {
            --color-online: #4CAF50;
            --color-offline: #f44336;
            --color-warning: #FF9800;
            --color-accent: #4fc3f7;
            --bg-card: rgba(255,255,255,0.1);
            --bg-overlay: rgba(0,0,0,0.5);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 15px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('http://yangxq.cc:90/l4d2/src/bg3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* ==================== 标题 ==================== */
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* ==================== 统计栏 ==================== */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 15px;
            margin-bottom: 20px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; color: #fff; }
        .stat-label { font-size: 0.9em; opacity: 0.8; margin-top: 5px; }

        /* ==================== 服务器网格 ==================== */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* ==================== 服务器卡片 ==================== */
        .server-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        .server-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .server-card.online { border-color: var(--color-online); background: rgba(76,175,80,0.1); }
        .server-card.offline { border-color: var(--color-offline); background: rgba(244,67,54,0.05); }

        /* ==================== 状态指示灯 ==================== */
        .status-indicator {
            width: 12px; height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-indicator.online { background: var(--color-online); }
        .status-indicator.offline { background: var(--color-offline); animation: pulse 2s infinite; }
        .status-indicator.connecting { background: var(--color-warning); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        .server-header { margin-bottom: 15px; }
        .server-name { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; }
        .server-info { margin-bottom: 15px; font-size: 0.9em; opacity: 0.8; }

        /* ==================== 状态面板 ==================== */
        .server-status {
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 12px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .status-label { opacity: 0.7; }
        .status-value { font-weight: bold; color: var(--color-online); }
        .status-value.offline { color: var(--color-offline); }

        /* ==================== 玩家表格 ==================== */
        .player-table-header {
            display: flex;
            padding: 8px 10px;
            font-size: 0.8em;
            font-weight: bold;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.2);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .player-table-row {
            display: flex;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.85em;
        }
        .player-table-row:last-child { border-bottom: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
        .pth-name, .ptr-name { flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pth-time, .ptr-time { flex: 1; text-align: center; opacity: 0.7; }
        .pth-ping, .ptr-ping { flex: 1; text-align: right; }

        .player-list { max-height: 200px; overflow-y: auto; margin-top: 10px; }

        /* ==================== 玩家进度条 ==================== */
        .player-bar-wrap { flex: 1; height: 14px; background: rgba(255,255,255,0.15); border-radius: 7px; margin-left: 12px; overflow: hidden; }
        .player-bar-fill { height: 100%; background: linear-gradient(90deg, #4CAF50, #8BC34A); border-radius: 7px; transition: width 0.4s ease; min-width: 0; }

        /* ==================== 按钮 ==================== */
        .btn {
            display: block; width: 100%; padding: 10px;
            font-size: 1em; font-weight: bold; color: #fff;
            border: none; border-radius: var(--radius-md);
            cursor: pointer; text-align: center; transition: background 0.2s;
            text-decoration: none;
        }
        .join-btn { background: rgba(76,175,80,0.7); margin-bottom: 8px; }
        .join-btn:hover { background: rgba(76,175,80,0.9); }
        .join-btn.offline { background: rgba(244,67,54,0.6); pointer-events: none; cursor: not-allowed; }
        .join-btn.full { background: rgba(244,67,54,0.7); }

        .reset-btn { background: rgba(255,87,34,0.7); margin-top: 12px; }
        .reset-btn:hover { background: rgba(255,87,34,0.9); }

        /* ==================== 友情链接 ==================== */
        .links-panel {
            background: var(--bg-overlay); border-radius: var(--radius-lg); padding: 20px; margin-top: 30px;
        }
        .links-panel h2 { margin-bottom: 15px; font-size: 1.5em; }
        .links-list { display: flex; gap: 15px; flex-wrap: wrap; }
        .links-list a {
            color: var(--color-accent); text-decoration: none;
            padding: 8px 15px; background: rgba(79,195,247,0.1);
            border-radius: var(--radius-md); transition: all 0.2s;
        }
        .links-list a:hover { background: rgba(79,195,247,0.3); }

        /* ==================== 日志面板 ==================== */
        .log-panel {
            background: var(--bg-overlay); border-radius: var(--radius-lg); padding: 20px; margin-top: 30px;
        }
        .log-panel h2 { margin-bottom: 15px; font-size: 1.5em; }
        #globalLog {
            background: rgba(0,0,0,0.3); border-radius: var(--radius-md); padding: 15px;
            max-height: 300px; overflow-y: auto;
            font-family: 'Courier New', monospace; font-size: 0.9em;
        }
        .log-line { margin-bottom: 5px; padding: 5px; border-left: 3px solid #2196F3; padding-left: 10px; }
        .log-line.error { border-left-color: var(--color-offline); color: #ff6b6b; }
        .log-line.success { border-left-color: var(--color-online); color: #69db7c; }

        /* ==================== 密码对话框 ==================== */
        .dialog-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .dialog-box {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: var(--radius-lg); padding: 30px; max-width: 400px; width: 90%;
            text-align: center;
        }
        .dialog-box h3 { margin-bottom: 15px; font-size: 1.5em; color: #fff; }
        .dialog-box input[type="text"],
        .dialog-box input[type="password"] {
            width: 100%; padding: 12px; font-size: 1em;
            border: 2px solid rgba(255,255,255,0.3); border-radius: var(--radius-md);
            background: rgba(255,255,255,0.1); color: #fff; margin-bottom: 15px;
            text-align: center;
        }
        .dialog-box input:focus { outline: none; border-color: #2196F3; }
        .error-message {
            color: #ff6b6b; background: rgba(255,0,0,0.2);
            padding: 10px; border-radius: var(--radius-md); margin-bottom: 15px; font-weight: bold;
        }
        .dialog-buttons { display: flex; gap: 10px; }
        .dialog-btn {
            flex: 1; padding: 12px; font-size: 1em; font-weight: bold;
            border: none; border-radius: var(--radius-md); cursor: pointer; transition: background 0.2s;
        }
        .dialog-btn.cancel { background: rgba(255,255,255,0.2); color: #fff; }
        .dialog-btn.cancel:hover { background: rgba(255,255,255,0.3); }
        .dialog-btn.confirm { background: rgba(255,87,34,0.8); color: #fff; }
        .dialog-btn.confirm:hover { background: rgba(255,87,34,1); }

        @media (max-width: 768px) {
            .servers-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.8em; }
            .stats-bar { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 统计栏 -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="onlinePlayers">-</div>
                <div class="stat-label">在线玩家</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="onlineServers">0</div>
                <div class="stat-label">在线服务器</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalServers">0</div>
                <div class="stat-label">总服务器</div>
            </div>
        </div>

        <h1>求生之路2 - 服务器监控</h1>

        <!-- 服务器网格 -->
        <div class="servers-grid" id="serversGrid"></div>

        <!-- 友情链接 -->
        <div class="links-panel">
            <h2>🔗 友情链接</h2>
            <div class="links-list">
                <a href="http://yangxq.cc:90/l4d2/status/[lwyxb]三方图下载器v2.0.exe" target="_blank">地图下载器</a>
                <a href="https://steamcommunity.com/groups/lwyxb" target="_blank">[lwyxb]来玩游戏吧Steam组</a>
            </div>
        </div>

        <!-- 日志面板 -->
        <div class="log-panel">
            <h2>📋 全局日志</h2>
            <div id="globalLog"></div>
        </div>

        <!-- 作者信息 -->
        <div style="text-align:center; padding:20px; margin-top:30px; font-size:0.9em; opacity:0.7;">
            <p>作者：51青年</p>
        </div>
    </div>

    <!-- 密码对话框 -->
    <div id="resetDialog" class="dialog-overlay" style="display:none;">
        <div class="dialog-box">
            <h3>重置服务器</h3>
            <p>输入 RCON 指令（留空则执行 <code>map c1m1</code>）</p>
            <p style="font-size:0.9em;color:#ffaa00;margin-bottom:15px;">⚠ 执行指令前需确认管理员密码</p>
            <div id="resetErrorMsg" class="error-message" style="display:none;"></div>
            <input type="text" id="resetCommand" placeholder="如: map c1m1 或 restart">
            <input type="password" id="resetPassword" placeholder="请输入管理员密码" onkeydown="handleDialogKeydown(event)">
            <div class="dialog-buttons">
                <button class="dialog-btn cancel" onclick="hideResetDialog()">取消</button>
                <button class="dialog-btn confirm" onclick="resetServer()">执行指令</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 全局状态管理 ====================
        const State = {
            servers: [],
            serverStates: new Map(),
            serverLastRefresh: new Map(),
            lastServerCommands: new Map(),
            serverStatusData: {},
            refreshInterval: null,
            refreshLoopStarted: false,
            currentResetServerId: null,
        };

        // ==================== 常量 ====================
        const REFRESH_INTERVAL_ONLINE = 60000;   // 在线服务器刷新间隔 60s
        const REFRESH_INTERVAL_OFFLINE = 10000;  // 离线服务器重试间隔 10s
        const UI_CHECK_INTERVAL = 3000;           // UI 检查间隔 3s

        // ==================== 初始化 ====================
        function init() {
            loadServers();
        }

        // ==================== 日志功能 ====================
        function log(message, type = 'info') {
            const logDiv = document.getElementById('globalLog');
            if (!logDiv) return;

            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            // 限制日志行数
            while (logDiv.children.length > 100) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }

        // ==================== 服务器列表加载 ====================
        async function loadServers() {
            try {
                const response = await fetch('/api/servers');
                const data = await response.json();
                
                if (data.error) {
                    log(`✗ 加载服务器列表失败: ${data.error}`, 'error');
                    return;
                }
                
                State.servers = data.servers;
                document.getElementById('totalServers').textContent = State.servers.length;
                renderServers();
                
                // 初始并行加载所有服务器状态
                await Promise.all(State.servers.map((_, index) => getServerStatus(index)));
                
                log(`✓ 已加载 ${State.servers.length} 个服务器`, 'success');
            } catch (error) {
                log(`✗ 请求服务器列表失败: ${error.message}`, 'error');
            }
        }

        // ==================== 渲染服务器卡片 ====================
        function renderServers() {
            const grid = document.getElementById('serversGrid');
            grid.innerHTML = '';
            
            State.servers.forEach((server, index) => {
                const card = document.createElement('div');
                card.className = 'server-card';
                card.id = `server-${index}`;
                card.innerHTML = `
                    <div class="server-header">
                        <div class="server-name">
                            <span class="status-indicator connecting" id="indicator-${index}"></span>
                            <span id="hostname-${index}">获取中...</span>
                        </div>
                    </div>
                    <div class="server-status" id="status-${index}">
                        <div class="status-row">
                            <span class="status-label">当前地图:</span>
                            <span class="status-value" id="map-${index}">-</span>
                        </div>
                        <div class="status-row" style="margin-bottom:8px;align-items:center;">
                            <span class="status-label">👥 当前玩家</span>
                            <div class="player-bar-wrap">
                                <div class="player-bar-fill" id="playerBar-${index}" style="width:0%;"></div>
                            </div>
                        </div>
                        <div class="player-list" id="playerList-${index}">暂无玩家</div>
                    </div>
                    <a class="btn join-btn" id="joinBtn-${index}" href="javascript:void(0)">加入服务器</a>
                    <button class="btn reset-btn" id="resetBtn-${index}" onclick="handleReset(${index})">重置服务器</button>
                `;
                grid.appendChild(card);
            });
        }

        // ==================== 获取服务器状态 ====================
        async function getServerStatus(serverIndex) {
            const server = State.servers[serverIndex];
            if (!server) return;
            
            try {
                const response = await fetch(`/api/status?id=${server.id}`);
                const data = await response.json();
                
                State.serverLastRefresh.set(serverIndex, Date.now());
                
                if (data.error) {
                    log(`✗ [${server.host}:${server.cport}] ${data.error}`, 'error');
                    State.serverStates.set(serverIndex, false);
                    updateServerUI(serverIndex, false);
                } else {
                    State.serverStates.set(serverIndex, true);
                    updateServerUI(serverIndex, true);
                    updateServerStatus(serverIndex, data.status, data.mapinfo);
                    log(`✓ [${server.host}:${server.cport}] 状态已更新`, 'success');
                }
            } catch (error) {
                log(`✗ [${server.host}:${server.cport}] 请求失败: ${error.message}`, 'error');
                State.serverStates.set(serverIndex, false);
                updateServerUI(serverIndex, false);
            }
        }

        // ==================== 更新服务器 UI 状态 ====================
        function updateServerUI(serverIndex, isOnline) {
            const card = document.getElementById(`server-${serverIndex}`);
            const indicator = document.getElementById(`indicator-${serverIndex}`);
            const hostnameEl = document.getElementById(`hostname-${serverIndex}`);
            const joinBtn = document.getElementById(`joinBtn-${serverIndex}`);
            
            if (!card || !indicator) return;

            card.classList.toggle('online', isOnline);
            card.classList.toggle('offline', !isOnline);
            indicator.className = `status-indicator ${isOnline ? 'online' : 'offline'}`;
            
            if (joinBtn) {
                joinBtn.classList.toggle('offline', !isOnline);
                if (!isOnline) joinBtn.href = 'javascript:void(0)';
            }
            
            if (!isOnline && hostnameEl) {
                hostnameEl.textContent = '连接失败';
                hostnameEl.classList.add('offline');
            }
            
            updateStats();
        }

        // ==================== 更新服务器状态详情 ====================
        function updateServerStatus(serverIndex, status, mapinfo) {
            updateHostname(serverIndex, status);
            updateMapInfo(serverIndex, status, mapinfo);
            updatePlayerList(serverIndex, status);
            updatePlayerBar(serverIndex, status);
            updateJoinButton(serverIndex, status);
            
            // 存储状态数据供重置按钮判断使用
            State.serverStatusData[serverIndex] = {
                humanPlayers: status.humanPlayers || 0,
                mapinfo: mapinfo || null
            };
        }

        function updateHostname(serverIndex, status) {
            const hostnameEl = document.getElementById(`hostname-${serverIndex}`);
            if (!hostnameEl) return;
            
            let name = status.hostname || '-';
            const secondBracket = name.indexOf('[', 1);
            if (secondBracket > 0) name = name.substring(0, secondBracket);
            hostnameEl.textContent = name;
        }

        function updateMapInfo(serverIndex, status, mapinfo) {
            const mapEl = document.getElementById(`map-${serverIndex}`);
            if (!mapEl) return;
            
            if (mapinfo && mapinfo.mapNameCN) {
                const displayText = `${mapinfo.mapNameCN}[章节${mapinfo.chapterOrder}/${mapinfo.mapCoopChapterN}]`;
                
                if (mapinfo.isValue === '0') {
                    let url = '';
                    if (mapinfo.modID) {
                        url = `https://steamcommunity.com/sharedfiles/filedetails/?id=${mapinfo.modID}`;
                    } else if (mapinfo.gamemapsID) {
                        url = `https://www.gamemaps.com/details/${mapinfo.gamemapsID}`;
                    }
                    
                    if (url) {
                        mapEl.innerHTML = `<a href="${url}" target="_blank" style="color:#4fc3f7;text-decoration:underline;">${displayText}</a>`;
                    } else {
                        mapEl.textContent = displayText;
                    }
                } else {
                    mapEl.textContent = displayText;
                }
            } else {
                mapEl.textContent = status.map || '-';
            }
        }

        function updatePlayerList(serverIndex, status) {
            const playerListEl = document.getElementById(`playerList-${serverIndex}`);
            if (!playerListEl) return;
            
            playerListEl.innerHTML = '';
            
            if (status.playerList && status.playerList.length > 0) {
                // 表头
                const thead = document.createElement('div');
                thead.className = 'player-table-header';
                thead.innerHTML = '<span class="pth-name">玩家名称</span>'
                                + '<span class="pth-time">在线时间</span>'
                                + '<span class="pth-ping">延迟</span>';
                playerListEl.appendChild(thead);

                // 玩家列表
                status.playerList.forEach(player => {
                    const item = document.createElement('div');
                    item.className = 'player-table-row';
                    
                    const isBot = player.isBot === true;
                    const cleanName = player.name ? player.name.replace(/"/g, '') : '';
                    const timeDisplay = isBot ? '-' : formatPlayTime(player.time);
                    const pingDisplay = isBot ? '-' : `${(player.ping || '0')}ms`;
                    
                    item.innerHTML = `<span class="ptr-name">${cleanName}`
                        + (isBot ? ' <span style="color:#4CAF50;font-size:0.85em;">[BOT]</span>' : '')
                        + '</span>'
                        + `<span class="ptr-time">${timeDisplay}</span>`
                        + `<span class="ptr-ping">${pingDisplay}</span>`;
                    
                    playerListEl.appendChild(item);
                });
            } else {
                playerListEl.textContent = '暂无玩家';
            }
        }

        function formatPlayTime(timeStr) {
            if (!timeStr) return '-';
            
            let timeMinutes = 0;
            
            if (/^\d+:\d+:\d+$/.test(timeStr)) {
                const parts = timeStr.split(':');
                timeMinutes = parseInt(parts[0]) * 60 + parseInt(parts[1]);
            } else if (/^\d+:\d+$/.test(timeStr)) {
                timeMinutes = parseInt(timeStr.split(':')[0]);
            } else if (/^\d+$/.test(timeStr)) {
                timeMinutes = Math.floor(parseInt(timeStr) / 60);
            } else {
                timeMinutes = parseInt(timeStr) || 0;
            }
            
            return `${timeMinutes}分钟`;
        }

        function updatePlayerBar(serverIndex, status) {
            const playerBarEl = document.getElementById(`playerBar-${serverIndex}`);
            if (!playerBarEl) return;
            
            const current = status.humanPlayers || 0;
            const max = status.maxPlayers || 4;
            
            if (max > 0) {
                const percentage = Math.min(100, Math.round((current / max) * 100));
                playerBarEl.style.width = `${percentage}%`;
            } else {
                playerBarEl.style.width = '0%';
            }
        }

        function updateJoinButton(serverIndex, status) {
            const joinBtn = document.getElementById(`joinBtn-${serverIndex}`);
            if (!joinBtn) return;
            
            const current = status.humanPlayers || 0;
            const max = status.maxPlayers || 4;
            
            if (current >= max) {
                joinBtn.classList.add('full');
                joinBtn.innerHTML = '<span class="status-indicator offline"></span>人数已满';
            } else {
                joinBtn.classList.remove('full');
                joinBtn.innerHTML = '<span class="status-indicator online"></span>加入服务器';
            }
            
            // 更新加入按钮链接
            if (status.ip) {
                const ipMatch = status.ip.match(/public\s+([\d.]+)/);
                if (ipMatch) {
                    joinBtn.href = `steam://connect/${ipMatch[1]}:${State.servers[serverIndex].cport}`;
                }
            }
        }

        // ==================== 更新统计信息 ====================
        function updateStats() {
            const onlineCount = Array.from(State.serverStates.values()).filter(v => v).length;
            document.getElementById('onlineServers').textContent = onlineCount;
            updateOnlinePlayers();
        }

        function updateOnlinePlayers() {
            let total = 0;
            document.querySelectorAll('[id^="playerList-"]').forEach(el => {
                total += el.querySelectorAll('.player-table-row').length;
            });
            document.getElementById('onlinePlayers').textContent = total || '-';
        }

        // ==================== 智能刷新循环 ====================
        function startRefreshLoop() {
            if (State.refreshLoopStarted) return;
            State.refreshLoopStarted = true;
            
            State.refreshInterval = setInterval(() => {
                const now = Date.now();
                
                State.servers.forEach((server, index) => {
                    const isOnline = State.serverStates.get(index) === true;
                    const lastRefresh = State.serverLastRefresh.get(index) || 0;
                    const interval = isOnline ? REFRESH_INTERVAL_ONLINE : REFRESH_INTERVAL_OFFLINE;
                    
                    if (now - lastRefresh >= interval) {
                        getServerStatus(index);
                    }
                });
            }, UI_CHECK_INTERVAL);
        }

        // ==================== 重置按钮主流程 ====================
        async function handleReset(serverIndex) {
            const data = State.serverStatusData[serverIndex];
            
            if (!data) {
                log('错误：无法获取服务器状态', 'error');
                return;
            }
            
            if (data.humanPlayers > 0) {
                // 有真人玩家，需要密码
                showResetDialog(serverIndex);
            } else {
                // 无真人玩家，判断是否需要重置
                if (!data.mapinfo || data.mapinfo.isValue === '0') {
                    await performReset(serverIndex, false);
                } else if (data.mapinfo.isValue === '1') {
                    alert('当前服务器不需要重置');
                } else {
                    // 无地图信息，仍尝试重置
                    await performReset(serverIndex, false);
                }
            }
        }

        async function performReset(serverIndex, needPassword) {
            const serverId = State.servers[serverIndex].id;
            const url = needPassword 
                ? '/api/exec_command' 
                : `/api/reset_server_quick?id=${serverId}`;
            
            log(`正在重置服务器...`, 'info');
            
            try {
                let response;
                
                if (needPassword) {
                    const command = document.getElementById('resetCommand').value.trim();
                    const password = document.getElementById('resetPassword').value;
                    const execCommand = command || State.lastServerCommands.get(serverId) || 'map c1m1';
                    
                    const formData = new FormData();
                    formData.append('id', serverId);
                    formData.append('password', password);
                    formData.append('command', execCommand);
                    
                    response = await fetch(url, { method: 'POST', body: formData });
                } else {
                    response = await fetch(url);
                }
                
                const result = await response.json();
                
                if (result.error) {
                    if (needPassword) {
                        const errorMsg = document.getElementById('resetErrorMsg');
                        errorMsg.textContent = result.error.includes('密码') ? '密码错误，请重试' : result.error;
                        errorMsg.style.display = 'block';
                    } else {
                        log(`重置失败：${result.error || '未知错误'}`, 'error');
                        alert(`重置失败：${result.error || '未知错误'}`);
                    }
                } else {
                    if (needPassword) {
                        State.lastServerCommands.set(serverId, document.getElementById('resetCommand').value.trim() || 'map c1m1');
                        log('✓ 该服务器已重置，请稍等片刻...', 'success');
                        alert('该服务器已重置，请稍等片刻...');
                        hideResetDialog();
                    } else {
                        log(`✓ ${result.message}`, 'success');
                        alert('该服务器已重置，请稍等片刻...');
                    }
                    
                    setTimeout(() => getServerStatus(serverIndex), 6000);
                }
            } catch (error) {
                log(`重置失败：${error.message}`, 'error');
                alert(`重置失败：${error.message}`);
            }
        }

        // ==================== 密码确认对话框 ====================
        function showResetDialog(serverIndex) {
            const server = State.servers[serverIndex];
            if (!server) return;
            
            State.currentResetServerId = server.id;
            
            const dialog = document.getElementById('resetDialog');
            const commandInput = document.getElementById('resetCommand');
            const passwordInput = document.getElementById('resetPassword');
            const errorMsg = document.getElementById('resetErrorMsg');
            
            if (commandInput) commandInput.value = State.lastServerCommands.get(server.id) || '';
            if (passwordInput) passwordInput.value = '';
            if (errorMsg) errorMsg.style.display = 'none';
            
            if (dialog) dialog.style.display = 'flex';
            if (commandInput) commandInput.focus();
        }

        function hideResetDialog() {
            const dialog = document.getElementById('resetDialog');
            if (dialog) dialog.style.display = 'none';
            State.currentResetServerId = null;
        }

        async function resetServer() {
            const serverIndex = State.servers.findIndex(s => s.id == State.currentResetServerId);
            if (serverIndex === -1) {
                log('错误：未找到服务器', 'error');
                return;
            }
            await performReset(serverIndex, true);
        }

        function handleDialogKeydown(event) {
            if (event.key === 'Enter') resetServer();
            else if (event.key === 'Escape') hideResetDialog();
        }

        // ==================== 页面生命周期 ====================
        window.onload = () => {
            init();
            startRefreshLoop();
        };

        window.onbeforeunload = () => {
            if (State.refreshInterval) clearInterval(State.refreshInterval);
        };
    </script>
</body>
</html>
