# ============================================================
# L4D2 服务器监控系统 - 配置文件
# 使用 UTF-8 编码保存
# ============================================================

# ==================== 服务器配置 ====================
# 服务器的rcon管理密码。在服务器的Server.cfg定义
[rcon]
password = 必填

# ==================== 管理员配置 ====================
# 前端执行重置/管理操作时需要的密码
[admin]
password = 选填

# ==================== 调试模式 ====================
# 为 true 时，API 会返回 RCON 原始数据（用于开发调试）
[app_debug]
enabled = false

# ==================== Web 服务配置 ====================
[server]
# Flask 监听地址（0.0.0.0 表示监听所有网卡）
host = 0.0.0.0
# 监听端口
port = 80
# Flask 调试模式（开发时开启，生产环境请关闭）
debug = true

# ==================== 服务器列表 ====================
# 每个服务器对应一个 [server.N] 小节，N 为服务器 ID（对应原数据库 id 字段）
# enabled = true   → 参与监控
# enabled = false  → 禁用（不再查询，前端不显示）
# cport            → 客户端连接端口（玩家加入服务器用）
# pport            → RCON 通信端口（后台管理用）
# 请自行添加自己的服务器信息

[server.1]
host    = yangxq.cc
cport   = 27011
pport   = 27011
enabled = true
comment =

[server.2]
host    = yangxq.cc
cport   = 27021
pport   = 27021
enabled = true
comment =

[server.3]
host    = yangxq.cc
cport   = 27041
pport   = 27041
enabled = true
comment =